<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManuscriptAI | Professional Academic Formatter</title>
    <meta name="description" content="AI-powered manuscript formatting for top-tier academic venues. Format your papers for IEEE, Nature, Cell, ACM, and more.">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Local compiled Tailwind CSS (generated during build) -->
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.svg">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Quill.js for WYSIWYG Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body class="bg-[#050505] text-slate-200 font-['Inter'] min-h-screen selection:bg-indigo-500/30">

    <!-- Ambient Background -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_50%_0%,_#1e1b4b_0%,_#050505_100%)] -z-10 opacity-50"></div>
    <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-500/5 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute top-[60%] -right-[5%] w-[35%] h-[35%] bg-blue-500/5 rounded-full blur-[120px] animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <!-- ===== AUTH OVERLAY ===== -->
    <div id="auth-overlay" class="fixed inset-0 z-[90] flex items-center justify-center p-6">
        <div id="auth-container" class="w-full max-w-md relative">
            <!-- Auth UI rendered by JS -->
        </div>
    </div>

    <!-- ===== APP SHELL (hidden until authenticated) ===== -->
    <div id="app-shell" class="hidden flex flex-col min-h-screen">

        <!-- ===== GLASSMORPHISM HEADER ===== -->
        <header id="main-header" class="glass-header sticky top-0 z-50 transition-all duration-500">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

                <!-- Logo -->
                <a href="#/home" class="flex items-center gap-3 group flex-shrink-0">
                    <div class="w-11 h-11 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-indigo-500/20 rotate-3 group-hover:rotate-0 transition-transform duration-300">
                        <i data-lucide="scroll-text" class="text-white w-6 h-6"></i>
                    </div>
                    <div class="hidden sm:block">
                        <h1 class="font-black text-xl tracking-tighter uppercase italic leading-none">Manuscript<span class="text-indigo-500">AI</span></h1>
                        <p class="text-[8px] text-slate-500 uppercase font-black tracking-[0.25em]">Neural Formatting</p>
                    </div>
                </a>

                <!-- Center Nav (Desktop) -->
                <nav class="hidden md:flex items-center" id="desktop-nav">
                    <div class="flex items-center bg-white/[0.03] rounded-2xl p-1.5 border border-white/[0.06] gap-1">
                        <a href="#/home" class="nav-link active" id="nav-home" data-route="home">
                            <i data-lucide="home" class="w-4 h-4"></i>
                            <span>Home</span>
                        </a>
                        <a href="#/about" class="nav-link" id="nav-about" data-route="about">
                            <i data-lucide="sparkles" class="w-4 h-4"></i>
                            <span>About</span>
                        </a>
                        <a href="#/history" class="nav-link" id="nav-history" data-route="history">
                            <i data-lucide="folder-clock" class="w-4 h-4"></i>
                            <span>History</span>
                        </a>
                    </div>
                </nav>

                <!-- Right: Profile + Mobile Toggle -->
                <div class="flex items-center gap-3 flex-shrink-0">
                    <!-- Profile Button -->
                    <div class="relative" id="profile-wrapper">
                        <button id="profile-btn" class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500/20 to-blue-500/20 border border-white/10 flex items-center justify-center hover:border-indigo-500/40 transition-all duration-300 group" title="Profile">
                            <span id="profile-avatar-text" class="text-sm font-bold text-indigo-400 group-hover:text-indigo-300 transition-colors">U</span>
                        </button>
                        <!-- Profile Dropdown -->
                        <div id="profile-dropdown" class="absolute right-0 top-14 w-64 glass-dropdown hidden">
                            <div class="p-4 border-b border-white/5">
                                <p id="dropdown-name" class="font-bold text-sm text-slate-200">User</p>
                                <p id="dropdown-email" class="text-xs text-slate-500 mt-0.5">user@email.com</p>
                            </div>
                            <div class="p-2">
                                <a href="#/profile" class="dropdown-item" id="dropdown-profile-link">
                                    <i data-lucide="user-circle" class="w-4 h-4"></i>
                                    <span>My Profile</span>
                                </a>
                                <a href="#/history" class="dropdown-item">
                                    <i data-lucide="clock" class="w-4 h-4"></i>
                                    <span>Formatting History</span>
                                </a>
                                <div class="border-t border-white/5 my-1"></div>
                                <button id="logout-btn" class="dropdown-item w-full text-rose-400 hover:bg-rose-500/10 hover:text-rose-300">
                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                    <span>Sign Out</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Mobile Menu Toggle -->
                    <button id="mobile-menu-btn" class="md:hidden w-10 h-10 rounded-xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center hover:bg-white/[0.08] transition-all">
                        <i data-lucide="menu" class="w-5 h-5 text-slate-400" id="mobile-menu-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Menu Panel -->
            <div id="mobile-menu" class="md:hidden hidden border-t border-white/[0.05] bg-black/70 backdrop-blur-2xl">
                <div class="p-4 space-y-1 max-w-7xl mx-auto">
                    <a href="#/home" class="mobile-nav-link active" data-route="home">
                        <i data-lucide="home" class="w-4 h-4"></i> <span>Home</span>
                    </a>
                    <a href="#/about" class="mobile-nav-link" data-route="about">
                        <i data-lucide="sparkles" class="w-4 h-4"></i> <span>About</span>
                    </a>
                    <a href="#/history" class="mobile-nav-link" data-route="history">
                        <i data-lucide="folder-clock" class="w-4 h-4"></i> <span>History</span>
                    </a>
                    <a href="#/profile" class="mobile-nav-link" data-route="profile">
                        <i data-lucide="user" class="w-4 h-4"></i> <span>Profile</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- ===== DYNAMIC PAGE CONTENT ===== -->
        <main id="page-content" class="flex-1 relative">
            <!-- Pages rendered here by JS router -->
        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="site-footer mt-auto">
            <div class="footer-glow"></div>
    <script src="/static/compat-auth.js"></script>
</body>
</html>
